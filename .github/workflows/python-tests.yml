name: Python Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest

    - name: Check syntax
      run: python -m py_compile TFT_logger.py TFT_Control.py web.py web_auth.py utills.py virtual_tft.py audio_capture.py transcribe_client.py ha_mqtt.py live_stream.py ini_edit.py ern_policy.py transcriber/server.py

    - name: Check dashboard JS syntax
      run: node --check static/dashboard.js

    - name: Run tests
      run: python -m pytest tests -v
