# EAS Alert Logger Configuration

[serial]
port = /dev/tft911-data
baud = 1200

[logging]
log_dir = logs
log_level = INFO

[alerts]
alerts_dir = alerts
dedupe_window = 120

[notifications]
ntfy_topic =

[hardware]
filler_byte = 0xAB

[web]
host = 0.0.0.0
port = 5000

[control]
port = /dev/tft911-cmd
baud = 9600
pin = 915

[advanced]
serial_timeout = 1
serial_retry_delay = 1
notification_timeout = 5

# ── Alert audio capture (needs a USB sound card wired to the TFT audio output) ──
[audio]
enabled = false
# ALSA capture device — find it with: arecord -l   (card 1, device 0 → plughw:1,0)
device = plughw:1,0
sample_rate = 16000
# forward: TFT prints the header when the alert starts (default)
# lookback: TFT prints the header only after the message ends
mode = forward
pre_seconds = 2
min_seconds = 8
max_seconds = 150
silence_seconds = 4
silence_threshold = 300
lookback_seconds = 150
keep_files = 200

# ── GWES ERN origination rules (§1.4), enforced on the dashboard's originate button ──
# RWT max 2 per 7 days; DMO repeats warn; other live events need the "EAS" originator
# code, ADR, or a stated Network Operations approval / official-agency source.
[ern]
enforce = true
rwt_max = 2
rwt_window_days = 7
dmo_repeat_minutes = 10

# ── Live stream for Home Assistant speakers (Sonos / Apple TV) ──
# Needs [audio] enabled = true (shares the recorder), ffmpeg, and Icecast.
# source_password goes in secrets.ini
[stream]
enabled = false
icecast_host = 127.0.0.1
icecast_port = 8000
mount = /tft911.mp3
bitrate = 64k
# URL the speakers open. Leave empty to use this machine's LAN IP.
public_url =

# ── Whisper transcription server on the Proxmox box (transcriber/) ──
# token goes in secrets.ini
[transcribe]
url =

# ── Home Assistant via MQTT discovery ──
# username / password go in secrets.ini
[mqtt]
enabled = false
host =
port = 1883
discovery_prefix = homeassistant
# Counties that count as "local" for the Local warning sensor (default: [station] fips)
local_fips =
